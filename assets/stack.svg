<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .stack-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .stack-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }

      /* Orbital gentle pulsing */
      @keyframes orbitPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .stack-core-pulse {
        animation: orbitPulse 3.5s ease-in-out infinite;
      }

      /* Node floating motions applied to nested element */
      @keyframes nodeFloatA {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -5px); }
      }
      @keyframes nodeFloatB {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, 5px); }
      }
      .stack-float-a { animation: nodeFloatA 4s ease-in-out infinite; }
      .stack-float-b { animation: nodeFloatB 4.5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .stack-core-pulse, .stack-float-a, .stack-float-b {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>

    <linearGradient id="stack-blue-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <radialGradient id="stack-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="520" fill="#070b16"/>

  <!-- Card Frame -->
  <rect x="30" y="30" width="900" height="460" rx="16" fill="#0c1328" stroke="#1e2c56" stroke-width="1.5"/>
  <rect x="30" y="30" width="900" height="460" rx="16" fill="none" stroke="url(#stack-blue-crimson)" stroke-width="1.5" opacity="0.6"/>

  <!-- Header -->
  <g transform="translate(60, 68)">
    <text x="0" y="0" class="stack-font" font-size="22" font-weight="800" fill="#f1f5f9" letter-spacing="0.5">⚡ TECH STACK &amp; ORBITAL ECOSYSTEM</text>
    <text x="0" y="22" class="stack-mono" font-size="12" fill="#94a3b8">Interactive tiered stack mapping across language core, AI/ML models, and cloud infrastructure</text>
  </g>

  <!-- CENTER ORBITAL VISUAL (Orbits centered at 480, 185) -->
  <g id="stack-orbits-group">
    <!-- Center Ambient Glow -->
    <circle cx="480" cy="185" r="140" fill="url(#stack-center-glow)"/>

    <!-- Tilted Orbits Tracks (Tilted at -12 deg) -->
    <g transform="translate(480, 185) rotate(-12)">
      <!-- Outer Orbit (Cloud & Infra) -->
      <ellipse cx="0" cy="0" rx="380" ry="76" fill="none" stroke="#1e2c56" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>

      <!-- Middle Orbit (AI / ML) -->
      <ellipse cx="0" cy="0" rx="270" ry="54" fill="none" stroke="#ff354f" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

      <!-- Inner Orbit (Core Languages) -->
      <ellipse cx="0" cy="0" rx="160" ry="34" fill="none" stroke="#247bff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9"/>

      <!-- Central Core Hub inside orbit plane -->
      <g transform="rotate(12)">
        <g class="stack-core-pulse">
          <circle cx="0" cy="0" r="30" fill="#131e3d" stroke="url(#stack-blue-crimson)" stroke-width="2"/>
          <circle cx="0" cy="0" r="7" fill="#247bff"/>
          <text x="0" y="15" class="stack-mono" font-size="8" font-weight="700" fill="#f1f5f9" text-anchor="middle">CORE HUB</text>
        </g>
      </g>

      <!-- ================= INNER ORBIT NODES (rx=160, ry=34) ================= -->
      <!-- Python (left: -160, 0) -->
      <g transform="translate(-160, 0)">
        <g transform="rotate(12)">
          <g class="stack-float-a">
            <rect x="-38" y="-14" width="76" height="28" rx="14" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">🐍 Python</text>
          </g>
        </g>
      </g>

      <!-- TypeScript (right: 160, 0) -->
      <g transform="translate(160, 0)">
        <g transform="rotate(12)">
          <g class="stack-float-b">
            <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">📘 TypeScript</text>
          </g>
        </g>
      </g>

      <!-- React (top: 0, -34) -->
      <g transform="translate(0, -34)">
        <g transform="rotate(12)">
          <g class="stack-float-a">
            <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#61dafb" text-anchor="middle">⚛️ React</text>
          </g>
        </g>
      </g>

      <!-- ================= MIDDLE ORBIT NODES (rx=270, ry=54) ================= -->
      <!-- PyTorch (top-left: -220, -31) -->
      <g transform="translate(-220, -31)">
        <g transform="rotate(12)">
          <g class="stack-float-b">
            <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#070b16" stroke="#ff354f" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#ff354f" text-anchor="middle">🔥 PyTorch</text>
          </g>
        </g>
      </g>

      <!-- Hugging Face (top-right: 220, -31) -->
      <g transform="translate(220, -31)">
        <g transform="rotate(12)">
          <g class="stack-float-a">
            <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#070b16" stroke="#ff354f" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">🤗 HuggingFace</text>
          </g>
        </g>
      </g>

      <!-- TensorFlow (bottom: 0, 54) -->
      <g transform="translate(0, 54)">
        <g transform="rotate(12)">
          <g class="stack-float-b">
            <rect x="-48" y="-14" width="96" height="28" rx="14" fill="#070b16" stroke="#ff354f" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">🧠 TensorFlow</text>
          </g>
        </g>
      </g>

      <!-- ================= OUTER ORBIT NODES (rx=380, ry=76) ================= -->
      <!-- AWS (left: -350, 20) -->
      <g transform="translate(-350, 20)">
        <g transform="rotate(12)">
          <g class="stack-float-a">
            <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">☁️ AWS</text>
          </g>
        </g>
      </g>

      <!-- Docker (top: -120, -72) -->
      <g transform="translate(-120, -72)">
        <g transform="rotate(12)">
          <g class="stack-float-b">
            <rect x="-36" y="-14" width="72" height="28" rx="14" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">🐳 Docker</text>
          </g>
        </g>
      </g>

      <!-- PostgreSQL (bottom-right: 170, 68) -->
      <g transform="translate(170, 68)">
        <g transform="rotate(12)">
          <g class="stack-float-a">
            <rect x="-48" y="-14" width="96" height="28" rx="14" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">🐘 PostgreSQL</text>
          </g>
        </g>
      </g>

      <!-- Kubernetes (right: 350, -20) -->
      <g transform="translate(350, -20)">
        <g transform="rotate(12)">
          <g class="stack-float-b">
            <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
            <text x="0" y="4" class="stack-mono" font-size="11" font-weight="700" fill="#3b82f6" text-anchor="middle">☸️ Kubernetes</text>
          </g>
        </g>
      </g>

    </g>
  </g>

  <!-- GROUPED STACK CHIPS (BOTTOM SECTION) -->
  <g transform="translate(60, 315)">
    <!-- Row 1: Languages & Web Frameworks -->
    <g>
      <text x="0" y="20" class="stack-mono" font-size="12" font-weight="700" fill="#247bff">LANGUAGES &amp; WEB</text>
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="85" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="42" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Python</text>
        <rect x="95" y="0" width="95" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="142" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">TypeScript</text>
        <rect x="200" y="0" width="95" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="247" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">JavaScript</text>
        <rect x="305" y="0" width="70" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="340" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Java</text>
        <rect x="385" y="0" width="75" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="422" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">React</text>
        <rect x="470" y="0" width="80" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="510" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Node.js</text>
        <rect x="560" y="0" width="90" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="605" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">HTML/CSS</text>
      </g>
    </g>

    <!-- Row 2: AI, ML & GenAI -->
    <g transform="translate(0, 46)">
      <text x="0" y="20" class="stack-mono" font-size="12" font-weight="700" fill="#ff354f">AI, ML &amp; GENAI</text>
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="85" height="30" rx="8" fill="#1e2c56" stroke="#ff354f" stroke-width="1"/><text x="42" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">PyTorch</text>
        <rect x="95" y="0" width="100" height="30" rx="8" fill="#1e2c56" stroke="#ff354f" stroke-width="1"/><text x="145" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">TensorFlow</text>
        <rect x="205" y="0" width="115" height="30" rx="8" fill="#1e2c56" stroke="#ff354f" stroke-width="1"/><text x="262" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Hugging Face</text>
        <rect x="330" y="0" width="105" height="30" rx="8" fill="#1e2c56" stroke="#ff354f" stroke-width="1"/><text x="382" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Scikit-Learn</text>
        <rect x="445" y="0" width="85" height="30" rx="8" fill="#1e2c56" stroke="#ff354f" stroke-width="1"/><text x="487" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">RLHF</text>
        <rect x="540" y="0" width="100" height="30" rx="8" fill="#1e2c56" stroke="#ff354f" stroke-width="1"/><text x="590" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">LangChain</text>
      </g>
    </g>

    <!-- Row 3: Cloud, DB & DevOps -->
    <g transform="translate(0, 92)">
      <text x="0" y="20" class="stack-mono" font-size="12" font-weight="700" fill="#247bff">CLOUD &amp; DEVOPS</text>
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="65" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="32" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">AWS</text>
        <rect x="75" y="0" width="80" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="115" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Docker</text>
        <rect x="165" y="0" width="100" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="215" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Kubernetes</text>
        <rect x="275" y="0" width="70" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="310" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">Linux</text>
        <rect x="355" y="0" width="100" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="405" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">PostgreSQL</text>
        <rect x="465" y="0" width="90" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="510" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">MongoDB</text>
        <rect x="565" y="0" width="75" height="30" rx="8" fill="#131e3d" stroke="#247bff" stroke-width="1"/><text x="602" y="19" class="stack-mono" font-size="11" fill="#f1f5f9" text-anchor="middle">SQLite</text>
      </g>
    </g>
  </g>

</svg>